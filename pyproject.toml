[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harel-terminal"
version = "1.0.0"
description = "Bloomberg-style news terminal for a 22-name Israeli equity basket, built for short-term trading"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "feedparser>=6.0.11",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
harel = "harel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
