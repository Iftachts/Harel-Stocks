# =============================================================================
# Harel Terminal - Materiality model for a SHORT-TERM / INTRADAY trader
# =============================================================================
# final_score = clamp(
#     base(event_type)
#   * source_trust
#   * relation_multiplier
#   * float_sensitivity
#   * recency_decay
#   + boosts
#   - penalties , 0, 100)
#
# Tiers:  >=75 ALERT   |  55-74 HIGH  |  35-54 NORMAL  |  <35 NOISE (hidden)
#
# Design principle: a day trader cares about ONE question - "can this move the
# print in the next few hours?". Everything else is archive.
# =============================================================================

tiers:
  alert: 75
  high: 55
  normal: 35
  # below `normal` -> stored but filtered out of the default feed

# ---------------------------------------------------------------------------
# Event taxonomy. `patterns` are case-insensitive regexes matched against
# title + summary + filing form type. First match with the highest base wins;
# an item can carry several event types (all are recorded, max score used).
# ---------------------------------------------------------------------------
events:

  trading_halt:
    base: 94
    label: Trading halted / news pending
    # Second only to an outright takeover, and above every other event here, for
    # one reason: it is the only one where the market has stopped and you cannot
    # act. Everything else you can trade around; a T12 you can only be early or
    # late to. Volatility pauses share this type and are held down by the
    # HALT-VOLATILITY cap in `noise` below - they were 22 of 42 records in a
    # single session and would otherwise bury the halts that carry information.
    patterns:
      - "\\[HALT\\]"
      - "\\b(trading halt(ed)?|halted for news|news pending|trading suspension)\\b"
      - "\\b(T12|T1|H10|H11)\\b.{0,30}\\bhalt"
      - "\\bresumes? trading\\b"
      - "עצירת מסחר|הפסקת מסחר"

  merger_acquisition:
    base: 96
    label: M&A / takeover
    patterns:
      - "\\b(to be acquired|agrees? to acquire|definitive (merger|acquisition) agreement)\\b"
      # The plainest form of the headline, and the one that was missing:
      # "Perion Acquires PRN" reached the terminal through the 6-K exhibit and
      # matched nothing, because every pattern here wanted the negotiating verb
      # rather than the completed act.
      # `(?-i:[A-Z])` is deliberate: every pattern in this file compiles with
      # IGNORECASE, so a bare [A-Z] matches lowercase too and "discuss acquires
      # and buys in general terms" scored as a takeover. The scoped flag makes
      # the capital mean what it looks like - the acquired party is a proper
      # noun, which is what separates a headline from a sentence about M&A.
      - "\\b(acquires?|acquired|to acquire|buys|purchases?)\\b\\s+(?-i:[A-Z0-9])"
      - "\\bacquisition of\\b\\s+(?-i:[A-Z0-9])"
      # "Teva Announces Proposed Acquisition of a Novel Neuroscience Product" -
      # a real deal whose object is a common noun, so the capital-letter test
      # above cannot see it. An announcing verb in front carries it instead.
      - "\\b(announces?|proposed|completes?|completed|closes?|enters into)\\b.{0,30}\\bacquisition\\b"
      - "\\b(takeover (bid|offer)|tender offer|going private|buyout offer)\\b"
      - "\\b(merger agreement|scheme of arrangement)\\b"
      - "\\b(strategic alternatives|exploring a sale|review of strategic)\\b"
      - 'הצעת רכש|רכישת השליטה|מכירת השליטה|העברת השליטה'
      # "הסכם למיזוג מרכנתיל דיסקונט (בת בבעלות מלאה) עם ולתוך הבנק" is Discount
      # folding its own wholly-owned bank into itself - group housekeeping that
      # scored as a takeover at 96. A merger is only news when it is not in-house.
      - 'מיזוג(?!.{0,60}(בת\s+בבעלות\s+מלאה|חברה\s+בת|חברת\s+בת|חברות\s+בנות|בבעלות\s+מלאה))'
      - "(רוכשת|רוכש|רכשה|לרכוש)\\s+את\\b"

  short_seller_report:
    base: 88
    label: Short-seller report
    patterns:
      - "\\b(short (seller|report)|Hindenburg|Muddy Waters|Culper|Kerrisdale|Grizzly Research|Fuzzy Panda|Scorpion Capital|Night Market)\\b"
      - "\\baccounting (fraud|irregularit)"

  regulatory_decision_primary:
    base: 92
    label: FDA/EMA decision on our product
    patterns:
      # The trailing \b used to sit after the whole group, so "FDA approv"
      # could never match "FDA APPROVAL" - the next character is a letter, so
      # there is no boundary there. That silently blanked the most common
      # phrasing of the highest-base event in the taxonomy (92), including
      # every one of the 70 items the openFDA collector titles "[FDA APPROVAL]".
      - "\\bFDA approv\\w*"
      - "\\b(approves|approval of)\\b"
      - "\\bapproval\\b.{0,30}\\b(FDA|EMA|CHMP|MHRA|Health Canada)\\b"
      - "\\bcomplete response letter\\b|\\bCRL\\b"
      - "\\b(refuse to file|clinical hold|partial clinical hold)\\b"
      - "\\b(CHMP (positive|negative) opinion|marketing authorisation)\\b"
      - "\\b(PDUFA|BsUFA|GDUFA) (date|action)\\b"
      - "\\b(advisory committee|AdCom) (vote|meeting|recommend)"
      - "\\b510\\(k\\)\\b.{0,20}\\b(clearance|cleared)\\b|\\[FDA 510\\(k\\)\\]"
      - "\\b(De Novo (grant|classification)|premarket approval)\\b"
      - "\\bbreakthrough therapy designation\\b|\\bfast track designation\\b"
      - "\\b(BLA|NDA|ANDA|sNDA|sBLA) (approv|accept|submi)"

  clinical_readout:
    base: 90
    label: Clinical trial readout
    patterns:
      - "\\b(top-?line|topline) (results|data)\\b"
      - "\\b(met|did not meet|failed to meet|missed) (the )?primary endpoint\\b"
      - "\\bphase (1|2|3|I{1,3})\\b.{0,40}\\b(results|data|readout|trial (met|failed))"
      - "\\b(pivotal|registrational) (trial|study)\\b.{0,30}\\b(result|data)"
      - "\\b(trial (halted|terminated|discontinued)|study discontinued)\\b"
      - "\\b(interim analysis|DSMB|data safety monitoring)\\b"
      # Hebrew - Teva's celiac Phase 2a topline reached the Hebrew wire as
      # "מדווחת על תוצאות חיוביות בניסוי".
      - "תוצאות\\s+(חיוביות|שליליות|ביניים)\\s+ב?ניסוי"
      - "ניסוי\\s+(קליני|שלב)"
      - "עמד(ה)?\\s+ב?יעד\\s+ה?ראשוני"

  guidance_change:
    base: 86
    label: Guidance raised / cut / withdrawn
    patterns:
      - "\\b(raises?|lifts?|cuts?|lowers?|slashes?|withdraws?|suspends?)\\b.{0,25}\\b(guidance|outlook|forecast)\\b"
      - "\\b(guidance|outlook) (raised|cut|lowered|reduced|withdrawn|reaffirmed)\\b"
      - "\\bpre-?announce"
      - "\\bprofit warning\\b"
      - "עדכון תחזית|אזהרת רווח"
      - "(מעלה|מורידה|מעדכנת|חותכת)\\s+את\\s+ה?תחזית"
      - "(צופה|חוזה)\\s+.{0,20}(שנה|רבעון)\\s+(חזק|חלש)"

  earnings:
    base: 80
    label: Earnings / results
    patterns:
      - "\\b(reports?|announces?) (fourth|third|second|first|Q[1-4]|full[- ]year|quarterly|annual)\\b.{0,30}\\b(results|earnings)\\b"
      - "\\b(Q[1-4]|first|second|third|fourth) quarter (\\d{4} )?(results|earnings)\\b"
      - "\\bfinancial results for\\b"
      # "Announces Record Results for Revenue and Profitability" names no
      # quarter, so every quarter-anchored shape above misses it.
      - "\\b(record|preliminary|unaudited) (results|revenue|quarter)\\b"
      - "\\b(reports?|announces?|posts?)\\b.{0,25}\\b(record )?(results|earnings|revenues?)\\b"
      # Hebrew. Palo Alto's Q4 print reached MAYA as "8K-תוצאות כספיות לרבעון 4"
      # and scored 7.1 NOISE, so a 9% move was reported as having no news.
      - "דוחות כספיים|תוצאות רבעון"
      - "תוצאות\\s+כספיות"
      - "(מפרסמת|מפרסם|פרסמה)\\s+דוחות"
      - "דוח(ות)?\\s+(רבעון|רבעוני|כספי|שנתי|חציון)"
      - "הרווח\\s+(הנקי|למניה)"
      - "(עקפה|עקף|מכה|היכתה|היכו|הכתה)\\s+את\\s+ה?(תחזיות|צפיות|תחזית)"
      # Bank and insurer prints lead with net profit and return on equity.
      - 'רווח\s+(נקי|כולל)\s+(של|בסך|ברבעון)|תשואה\s+(להון|על\s+ההון)'
    # No form_types here on purpose. 8-K / 6-K are far too generic to imply
    # earnings; the 8-K Item code (2.02) carries that signal instead, via
    # `item_severity` from the EDGAR collector.

  equity_offering:
    base: 82
    label: Offering / dilution
    patterns:
      - "\\b(public offerings?|registered direct|private placements?|PIPE)\\b"
      - "\\b(notes? issuance|notes? offering|senior notes)\\b"
      - "\\b(at-the-market|ATM) (offering|program|facility)\\b"
      - "\\b(pricing of|prices) .{0,30}\\boffering\\b"
      - "\\b(convertible (notes|senior notes) offering)\\b"
      - "\\bshelf registration\\b"
      # Hebrew. Gilat's $100M convertible placement - real dilution on a $10
      # stock - arrived as "הנפקה פרטית של אג\"ח להמרה ל5 שנים בהיקף של 100מ$"
      # and scored 14.5 NOISE.
      - "הנפקת מניות|גיוס הון|הקצאה פרטית|הנפקה פרטית"
      - 'אג["״]?ח\s+להמרה|אגח\s+להמרה'
      # Not when the money is DEBT. "מידרוג קובעת דירוג P-1.il לגיוס נע"מ 10 בעד
      # 800מ'שח" - a rating on Discount's commercial paper - scored as an equity
      # raise, because "גיוס ... 800מ'" was all this asked for. A bank or a
      # landlord borrows every month; see debt_financing.
      - '(מגייס|מגייסת|גיוס)\s+(?!.{0,40}(נע["״]?מ|אג["״]?ח|אגרות\s+חוב|ניירות\s+ערך\s+מסחריים|חוב|הלווא|אשראי|מימון\s+בנקאי)).{0,25}(מיליון|מיליארד|מ[''׳])'
    form_types: ["424B5", "424B4", "S-1", "S-3", "F-1", "F-3", "S-3ASR"]
    float_sensitive: true            # micro/small caps score much higher here

  major_contract:
    base: 78
    label: Large order / contract win
    patterns:
      # The nouns are plural far more often than not - "Awarded Contracts",
      # "RECEIVES OVER $105 MILLION MULTI-SYSTEM ORDERS" - and a trailing \b
      # after a singular stem cannot match its own plural, so the wire's normal
      # phrasing was the one shape this never caught. Verbs widened for the same
      # reason: issuers write "Signed", "Announces" and "Enters into", not
      # "wins".
      # Two shapes, because the verbs differ in how much they promise.
      # "awarded / won / secured / signed" is already a completed deal, so
      # the noun alone is enough. "announces / enters into" is not - it also
      # heads "Announce Intent to Reach Agreement around Affordable
      # Medicines", a drug-pricing policy story that read as a Teva contract
      # win at 78 - so those require a stated amount.
      - "\\b(awarded|wins?|winning|secures?|secured|receives?|signs?|signed|lands?)\\b.{0,45}\\b(contracts?|orders?|awards?|tenders?|agreements?|deals?)\\b"
      - "\\b(announces?|announced|enters into|entered into|to (supply|provide|deliver))\\b.{0,45}\\b(contracts?|orders?|agreements?|deals?)\\b.{0,60}\\b(\\$|USD|million|billion)\\b"
      - "\\b(announces?|announced|enters into|entered into)\\b.{0,30}(\\$|USD)\\s?\\d[\\d.,]*\\s?(million|billion)?\\b.{0,40}\\b(contracts?|orders?|agreements?|deals?)\\b"
      - "\\$\\s?\\d[\\d.,]*\\s?(million|billion|M|B)\\b.{0,45}\\b(contracts?|orders?|awards?|deals?|agreements?)\\b"
      # "Signed Contracts ... Valued at Approximately $270 Million" and
      # "Awarded Contracts ... Totaling Over $370 Million" put the money AFTER
      # the noun, which neither of the two shapes above reaches.
      - "\\b(contracts?|orders?|awards?|agreements?)\\b.{0,45}\\b(valued at|worth|totalling|totaling|in the amount of)\\b"
      - "\\b(follow-on orders?|framework agreements?|IDIQ|indefinite delivery)\\b"
      - "\\bforeign military sale\\b"
      # Hebrew. Elbit's "~$270M international observation/intelligence
      # contracts" reached MAYA as "חתמה על חוזים עם לקוח בינלאומי בהיקף של
      # כ-270מ'$" and scored 7.6 NOISE - while the tape alert simultaneously
      # reported the move as unexplained.
      - "זכייה במכרז|הזמנה בהיקף"
      - "(חתמה|חתם|נחתם)\\s+על\\s+(חוז|הסכם|עסק)"
      - "(עסקה|חוזה|הסכם|הזמנה|התקשרות)\\s+.{0,25}בהיקף\\s+של"
      # NOT a bare "בהיקף של N million": that phrasing is equally common in a
      # buyback and a bond placement, and it scored Nova's $200M repurchase
      # as a $200M contract win (78 over its true 58). It needs a deal noun.
      - "(מערכות|ציוד|שירותים|פרויקט|אספקה|מכרז)\\s+.{0,40}בהיקף\\s+של"
      - "צבר\\s+ההזמנות"
      - "תספק\\s+.{0,40}(מערכות|ציוד|שירותים)"
      # MAYA's own phrasing of an order. Next Vision's "קבלת הזמנה לרכישת מצלמות
      # ... תמורת סך כולל של 24מ'$" - $24M against a small float - and its
      # English twin "Receipt of purchase order" both matched nothing.
      - '(קבלת|התקבלה|התקבלו|קיבלה|קיבל)\s+(ה)?(הזמנה|הזמנות|הזמנת)'
      - 'הזמנ(ה|ות)\s+.{0,80}תמורת\s+(סך\s+(כולל\s+)?(של\s+)?)?(כ[-־]?)?\d'
      - '(זכתה|זכה|זכו)\s+במכרז|הוכרז(ה)?\s+כזוכ(ה|ת)'
      # A signed deal turning real: conditions precedent met, deal effective,
      # closing. "דליה הודיעה לנומד ורצו כי ההסכם נכנס לתוקף" was NewMed's
      # Leviathan supply deal going live and scored as nothing.
      - '(ההסכם|העסקה|החוזה)\s+נכנס(ה)?\s+לתוקף|התקיימו\s+(כל\s+)?התנאים\s+(ה)?מתלים|הושגו\s+כל\s+התנאים|השלמת\s+(ה)?עסקה|הושלמה\s+(ה)?עסקה'
      - '\breceipt\s+of\s+(an?\s+)?(new\s+|additional\s+|follow-on\s+)?(purchase\s+)?orders?\b'
      - '\b(purchase|follow-on)\s+orders?\b.{0,60}(\$|USD|million|NIS|ILS)'
      - '\b(agreement|deal|contract)\s+(becomes|became|has\s+become)\s+effective\b|\bconditions\s+precedent\b.{0,30}\b(met|satisfied|fulfilled)\b|\b(declared|selected\s+as)\s+(the\s+)?winn(er|ing\s+bidder)\b'

  litigation_outcome:
    base: 76
    label: Legal / enforcement outcome
    patterns:
      - "\\b(jury (verdict|awards)|court (rules|ruling|orders)|judge (rules|dismisses))\\b"
      - "\\b(settlement|settles?)\\b.{0,30}\\b(\\$|million|billion|DOJ|SEC|FTC)"
      - "\\b(injunction|patent (invalidated|upheld)|infringement (found|ruling))\\b"
      - "\\b(DOJ|SEC|FTC|CMA|European Commission) (charges?|sues?|fines?|investigat)"
      - "\\bParagraph IV\\b"
      # Kenon collected ~$93M on an ICSID award against Peru - a cash
      # event, and the only shape in which that reaches the wire.
      - "\\b(arbitration|arbitral) (award|ruling|tribunal|panel)\\b"
      - "\\b(awarded|receipt of|collects?|recovers?)\\b.{0,40}\\b(damages|arbitration|judgment|settlement)\\b"
      # Hebrew, and only with money attached: Israeli banks and insurers file a
      # class-action notice most weeks, and those are capped in `noise`.
      - '(פסק\s+דין|פס["״]ד|הכרעת\s+בורר|פסק\s+בוררות|הסדר\s+פשרה)\s+.{0,60}(מיליון|מיליארד|מ[''׳]\s*ש|₪|ש["״]ח|\$)'

  compliance_action:
    base: 74
    label: Inspection / recall / warning letter
    patterns:
      - "\\b(warning letters?|Form 483s?|import alerts?|consent decrees?)\\b"
      - "\\b(class (I|II) recall|recalls?|market withdrawal)\\b"
      - "\\b(OAI|official action indicated)\\b"

  index_event:
    base: 72
    label: Index add / delete
    patterns:
      - "\\b(added to|removed from|deleted from|joins?)\\b.{0,25}\\b(S&P|Russell|Nasdaq-100|MSCI|FTSE|TA-35|TA-125|TA-90)\\b"
      - "\\bindex (rebalance|reconstitution)\\b"
      - '(נכנסת|נכנס|תיכנס|ייכנס|יצטרף|תצטרף|הצטרפה|הצטרף)\s+ל(מדד|מדדי)|(נגרעת|נגרע|ייגרע|תיגרע|יוצאת|יוצא|תצא|ייצא)\s+מ(ה)?(מדד|מדדי)|עדכון\s+(ה)?(הרכב\s+)?(ה)?מדד(ים)?\s+(ת["״]א|תל\s+אביב)'

  rating_change:
    base: 70
    label: Analyst rating / PT change
    # Widened deliberately. docs/LIMITATIONS.md prices this gap at $200-400/mo
    # (Benzinga), but the data was already arriving free and being discarded:
    # "Stifel initiates Tower Semiconductor stock with buy" scored 4.1 NOISE
    # because the old pattern demanded the literal word "coverage", and the
    # Hebrew wires carry a full analyst desk - Investing.com publishes
    # "פייפר סנדלר מעלה את יעד המחיר" for these names daily - which nothing read.
    patterns:
      - "\\b(upgrades?|downgrades?)\\b.{0,30}\\b(to|from)\\b.{0,25}\\b(buy|sell|hold|overweight|underweight|neutral|outperform|underperform|equal[- ]weight|market perform)\\b"
      - "\\b(double[- ]upgrade|double[- ]downgrade)\\b"
      - "\\b(initiates?|initiated|starts?|assumes?|resumes?|launches)\\b.{0,40}\\b(coverage|at (buy|sell|hold|overweight|underweight|neutral|outperform))\\b"
      - "\\b(initiates?|initiated)\\b.{0,60}\\bwith (a )?(buy|sell|hold|overweight|underweight|neutral|outperform|underperform)\\b"
      - "\\b(reiterates?|reaffirms?|maintains?|keeps)\\b.{0,40}\\b(buy|sell|hold|overweight|underweight|neutral|outperform|underperform|rating|price target)\\b"
      - "\\b(price target|target price|PT)\\b.{0,25}\\b(raised|lifted|cut|lowered|reduced|trimmed|boosted|increased|to \\$)"
      - "\\b(raises?|lifts?|cuts?|lowers?|trims?|boosts?)\\b.{0,25}\\b(price target|target price)\\b"
      # Hebrew - these are the exact phrasings Investing.com and the Israeli
      # wires publish, taken from what this system actually collected.
      - "יעד המחיר"
      - "(מעלה|מוריד|מורידה|מעלה את|מפחית)\\s+את\\s+(יעד|הדירוג|ההמלצה)"
      - "(חוזר|חוזרת|מאשרר|מאשררת|מאשר|מאשרת)\\s+על?\\s*(דירוג|המלצ)"
      - "דירוג\\s+(ה)?(קנייה|קניה|מכירה|החזקה)"
      - "(אושר|אושרה)\\s+מחדש"
      - "(מעלה|מורידה)\\s+את\\s+המלצ"

  listing_compliance:
    base: 68
    label: Listing / going-concern / restatement
    patterns:
      - "\\b(minimum bid price|listing (deficiency|compliance)|delisting notice)\\b"
      - "\\b(going concern|substantial doubt)\\b"
      - "\\b(restate(ment|s)?|non-reliance|material weakness)\\b"
      - "\\breverse stock split\\b"
    # Only forms that are unambiguous on their own. 8-K / 6-K must NOT be here:
    # they would tag every routine filing as a listing-compliance event.
    form_types: ["NT 10-K", "NT 10-Q", "NT 20-F", "25-NSE"]

  capital_return:
    base: 58
    label: Buyback / dividend
    patterns:
      - "\\b(share (repurchase|buyback)|buyback program|repurchase program)\\b"
      - "\\b(initiates?|increases?|raises?|cuts?|suspends?|declares?|announces?) .{0,20}\\bdividends?\\b"
      - "\\bspecial dividend\\b"
      # Hebrew. Nova's "$200M share repurchase programme" reached this system as
      # "תכנית רכישה עצמית של מניות בהיקף של 200מ'$" and scored 19.0 NOISE.
      - "רכישה\\s+עצמית"
      - "דיבידנד"

  competitive_threat:
    base: 64
    label: Competitive / platform threat
    # A platform owner bundling away your product, or a partner walking, is a
    # first-order event for several names here: Microsoft Teams for AUDC,
    # Microsoft Bing for PERI, Microsoft E5 bundling for PANW, AI agents for
    # NICE/LPSN. Nothing else in the taxonomy catches it.
    patterns:
      - "\\b(bundl(e|es|ed|ing))\\b.{0,80}?\\b(licens\\w*|subscription|suite|SKU|tier|at no (extra|additional) (cost|charge)|for free|free of charge)\\b"
      - "\\b(includ(e|es|ing)|adds?|offers?)\\b.{0,60}?\\b(for free|free of charge|at no (extra|additional) (cost|charge))\\b"
      - "\\b(price war|undercut(s|ting)?|slashes? prices|aggressive discounting)\\b"
      - "\\b(rip and replace|displac(e|es|ing)|migrat(e|es|ing) away from)\\b"
      - "\\b(terminat(es|ed|ion)|ends?|does not renew|non-?renewal)\\b.{0,45}\\b(partnerships?|agreements?|contracts?|collaborations?)\\b"
      - "\\b(bring(s|ing)?\\b.{0,40}\\bin-?house|insourc\\w+|builds? its own\\b.{0,40}\\b(platform|software|stack|solution|engine|model|tool))"

  management_change:
    base: 60
    label: CEO / CFO change
    patterns:
      # Bidirectional: the wire writes "Announces Planned Transition of Chief
      # Financial Officer" as often as "CFO steps down", and only one of those
      # two orders was matched.
      - "\\b(chief executive|CEO|chief financial|CFO|chairman|president)\\b.{0,40}\\b(resign|steps? down|departs?|appoint|named|to succeed|succeeds?|transition|terminat|interim)"
      - "\\b(resign\\w*|steps? down|departure|appoints?|appointment|names?|transition|succeeds?|interim)\\b.{0,40}\\b(chief executive|CEO|chief financial|CFO|chairman|president)\\b"
      - "\\bsudden (resignation|departure)\\b"
      # Both quote marks: MAYA writes מנכ"ל, the press often מנכ״ל - and
      # "המועמדים לתפקיד מנכ״ל מליסרון" matched neither form before.
      - '(מנכ["״]ל|מנכ["״]לית|סמנכ["״]ל|יו["״]ר|כספים)\s+.{0,30}(מתפטר|מתפטרת|התפטר|התפטרה|עוזב|עוזבת|פורש|פורשת|מונה|מונתה|ימונה|תמונה|יחליף|תחליף|יסיים|תסיים|סיים|סיימה)'
      - '(מינוי|סיום\s+כהונת|התפטרות|פרישת|מועמד(ים)?\s+לתפקיד)\s+(ה)?(מנכ["״]ל|מנכ["״]לית|יו["״]ר|סמנכ["״]ל\s+(ה)?כספים)'

  partnership_licensing:
    base: 62
    label: Partnership / licensing / milestone
    patterns:
      - "\\b(licen[sc]e agreements?|licensing deals?|collaboration agreements?|strategic partnerships?)\\b"
      - "\\b(milestone payments?|upfront payments?|option exercises?)\\b"
      - "\\b(expands?|extends?) .{0,30}\\b(strategic )?(relationship|partnership|collaboration)\\b"
      - "\\b(exclusive distribution agreement)\\b"

  insider_activity:
    base: 48
    label: Insider / large holder move
    patterns:
      # 13D only. A 13D is an activist declaring intent; a 13G is a passive
      # holder crossing 5%, usually an index fund, and lumping them together
      # scored every routine custodian filing as an insider move.
      - "\\b(13D|schedule 13D)\\b"
      - "\\b(activist (stake|investor)|builds? (a )?stake)\\b"
      - "\\bsecondary offering by (a )?(shareholder|holder)\\b"
    # Both spellings: EDGAR returns "SCHEDULE 13D" on recent filings and
    # "SC 13D" on older ones, in the same history.
    form_types: ["SC 13D", "SC 13D/A", "SCHEDULE 13D", "SCHEDULE 13D/A", "4"]

  operational_disruption:
    base: 70
    label: Plant / supply / outage / cyber
    patterns:
      - "\\b(cyber ?attack|ransomware|data breach|security incident)\\b"
      - "\\b(plant (shutdown|fire|explosion)|production (halt|suspension)|force majeure)\\b"
      - "\\b(supply (disruption|shortage)|unplanned outage)\\b"
      - '(השבתת|השבתה\s+של|הפסקת|הפסקה\s+ב|עצירת)\s+(ה)?(הפקה|הפקת|אספקת|ייצור|פעילות|המפעל|הקידוח|המאגר|הזרמת)'
      - 'כוח\s+עליון|מתקפת\s+סייבר|אירוע\s+סייבר|דליפת\s+מידע|סגירת\s+(ה)?(מאגר|אסדה|אסדת|מפעל)'

  macro_sector_policy:
    base: 66
    label: Policy / tariff / export control
    patterns:
      - "\\b(export control|entity list|foreign direct product rule)\\b"
      - "\\b(tariffs?|Section 232|Section 301|countervailing dut(y|ies)|antidumping)\\b"
      - "\\b(sanction(s|ed)?)\\b"
      - "\\b(final rule|interim final rule|proposed rule)\\b"
      - "\\b(reimbursement (rate|cut)|fee schedule)\\b"
      # Israel. The TA-35 banks, insurers, telecom and gas names answer to these
      # bodies, and every pattern above is American.
      - '(הפיקוח\s+על\s+הבנקים|המפקח(ת)?\s+על\s+הבנקים|רשות\s+שוק\s+ההון|הממונה\s+על\s+שוק\s+ההון|רשות\s+ניירות\s+ערך|רשות\s+התחרות|הממונה\s+על\s+התחרות|משרד\s+התקשורת|משרד\s+האנרגיה|הממונה\s+על\s+ענייני\s+הנפט|רשות\s+הגז|רשות\s+החשמל|רשות\s+מקרקעי\s+ישראל|משרד\s+האוצר|בנק\s+ישראל)\s+.{0,50}(מחליט|החליט|החליטה|מחליטה|קובע|קבע|קבעה|מטיל|הטיל|הטילה|דורש|דרש|דרשה|מאשר|אישר|אישרה|מתנגד|התנגד|התנגדה|הוראה|הוראות|הנחיה|הנחיות|טיוטת|קנס|עיצום|אסר|אוסר|הגביל|מגביל|ביטל|ביטלה|רפורמה)'
      - 'היטל\s+(על\s+)?(ה)?(בנקים|רווחי)|מס\s+(על\s+)?רווחי\s+(ה)?בנקים|מס\s+רווחי\s+יתר|מס\s+על\s+(ה)?בנקים'
      - '(העלאת|הורדת|העלה\s+את|הוריד\s+את|מעלה\s+את|מוריד\s+את|הותיר\s+את|מותיר\s+את|השאיר\s+את|משאיר\s+את)\s+(ה)?ריבית|החלטת\s+(ה)?ריבית|ריבית\s+בנק\s+ישראל'
      - 'עיצום\s+כספי|קנס\s+(בסך|של)\s'
      - '\bBank\s+of\s+Israel\b.{0,50}\b(rate|interest|decision|hikes?|cuts?|holds?|leaves?)\b'
      - '\b(bank\s+levy|windfall\s+tax|excess\s+profits?\s+tax)\b'
      - '\b(Israel\s+Securities\s+Authority|Competition\s+Authority|Capital\s+Market\s+Authority|Supervisor\s+of\s+Banks)\b'

  commodity_move:
    base: 60
    label: Commodity / price benchmark
    patterns:
      - "\\b(potash|bromine|phosphate|urea|ammonia) (prices?|contracts?)\\b"
      - "\\b(contract (settled|settlement)) .{0,20}\\b(China|India)\\b"
      - "\\bspot price (jump|surge|collapse|falls?|rises?)\\b"

  product_launch:
    base: 52
    label: Product launch / design win
    patterns:
      - "\\b(launches?|unveils?|introduces?|announces? availability)\\b"
      - "\\b(design win|qualified by|volume production)\\b"

  contract_termination:
    base: 74
    label: Contract cancelled / terminated
    # The inverse of a contract win and just as tradeable. NewMed and Ratio's
    # notice cancelling the $6.7b Leviathan supply deal with Dalia reached MAYA
    # three times in two days - "הודעת הביטול תקפה" - and scored as nothing.
    patterns:
      - '(ביטול|הודעת\s+(ה)?ביטול|סיום|הפסקת|ביטל|ביטלה|מבטלת|מבטל)\s+(את\s+)?(ה)?(הסכם|חוזה|עסקה|עסקת|התקשרות|הזמנה|הזמנת)'
      - '(ההסכם|החוזה|העסקה|ההתקשרות|ההזמנה)\s+.{0,50}(בוטל|בוטלה|מבוטל|מבוטלת|לא\s+ייכנס\s+לתוקף)'
      - 'הודעת\s+(ה)?ביטול'
      - '\b(cancel(s|led|ling|lation\s+of)?|terminat(es|ed|ion\s+of))\b.{0,40}\b(supply|purchase|gas|sales?|offtake)\s+(agreements?|contracts?|deals?)\b'
      - '\b(agreements?|contracts?|deals?|orders?)\b.{0,30}\b(cancell?ed|terminated)\b'

  exploration_result:
    base: 84
    label: Drilling result / discovery / reserves
    # For an exploration partnership the well IS the company: Navitas and
    # NewMed move on a discovery, a dry hole or a reserves report the way a
    # biotech moves on a readout.
    patterns:
      - '(תגלית|גילוי)\s+(של\s+)?(גז|נפט|מסחרי|מסחרית)|הכרזה\s+על\s+תגלית'
      - 'קידוח\s+.{0,40}(יבש|הצליח|הצלחה|תוצאות|נמצאו|נמצא|גילה|אותרו)'
      - '(דוח|עדכון)\s+(ה)?(משאבים|עתודות|רזרבות)|משאבים\s+מותנים|עתודות\s+מוכחות'
      - '(תחילת|התחלת)\s+(ה)?(הפקה|הפקת)|הפקה\s+ראשונה|גז\s+ראשון|נפט\s+ראשון|מבחני?\s+הפקה'
      - '\b(commercial\s+discovery|dry\s+(well|hole)|flow\s+test|first\s+(oil|gas)|reserves?\s+report|contingent\s+resources|proved\s+reserves|spud(ded)?)\b'
      - '\bdiscovery\b.{0,30}\b(well|field|gas|oil|reservoir)\b'

  asset_transaction:
    base: 64
    label: Asset purchase / sale
    # Below M&A on purpose. A landlord buying a mall or a holding company
    # selling a stake is material, but it is not a takeover of the listed
    # company - and "Ithaca signs a deal to buy Suncor's offshore assets"
    # (Delek Group's subsidiary) matched nothing at all.
    patterns:
      - '(הסכם|עסקה|עסקת|התקשרות|הצעה\s+מחייבת)\s+(ל|של\s+)?(רכישת|מכירת|מימוש)\s'
      - '(חתימה|חתמה|נחתם|נחתמה|חותמת)\s+על\s+(הסכם|עסקה)\s+(ל|של\s+)?(רכישת|מכירת)'
      - '(רכישת|מכירת|מימוש)\s+(ה)?(נכס|נכסי|נכסים|קרקע|קרקעות|מגרש|זכויות|החזקות|מקרקעין|בניין|קניון|מרכז\s+מסחרי|פעילות)'
      - '\b(sale|disposal|divestiture|divestment)\s+of\b.{0,40}\b(stake|interest|assets?|business|portfolio|propert(y|ies)|holdings?|subsidiary)\b'
      - '\b(acquir(e|es|ed|ing)|acquisition\s+of|purchas(e|es|ed|ing))\b.{0,30}\b(assets|portfolio|propert(y|ies)|land|stake\s+in|interest\s+in|working\s+interest)\b'

  disclosure_clarification:
    base: 52
    label: Company clarification / response to reports
    # A TASE issuer answering the press or an exchange query ("הבהרה בעקבות
    # פניות משקיעים") is usually responding to something that already moved
    # the stock - worth a look, not an alert on its own.
    patterns:
      - '(?<!\w)הבהרה(?!\w)|דיווח\s+מבהיר|תגובת\s+(ה)?חברה\s+ל|(התייחסות|תגובה)\s+(ה?חברה\s+)?ל(פרסום|פרסומים|כתבה|כתבות|דיווח|דיווחים)|בהמשך\s+לפרסומים'
      - '\b(clarif(ication|ying)\s+(report|announcement|statement|notice)|response\s+to\s+(media|press)\s+reports?|in\s+response\s+to\s+(an?\s+)?(article|report)\s+published)\b'

  operating_update:
    base: 48
    label: Operating / capital update
    # Solvency ratios for the insurers, apartment sales for the developers,
    # property revaluations for the landlords - each a number the sector
    # trades on between results.
    patterns:
      - '(יחס|יחסי)\s+(ה)?(כושר\s+(ה)?פירעון|סולבנסי|הון\s+(עצמי\s+)?(רובד|ליבה)|לימות\s+(ה)?הון)'
      - '(נתוני|עדכון)\s+(ה)?(מכירות|פעילות|תפעול|תפוסה)'
      - '(מכירת|נמכרו|מכר|מכרה)\s+\d[\d,]*\s+(יחידות\s+)?(דירות|יח["״]ד)'
      - '(שערוך|שיערוך)\s+(של\s+)?(נכסי|נדל["״]ן|הנכסים)'
      - '\bsolvency\s+(ratio|II)\b|\b(occupancy\s+rate|apartment\s+sales)\b'

  debt_financing:
    base: 30
    label: Bond / commercial-paper financing
    # Banks, insurers and landlords tap the TASE bond market constantly -
    # Leumi alone filed three in one week. It is funding, not dilution, and it
    # must not reach equity_offering at 82, which is what "גיוס ... מ'" did.
    patterns:
      - '(הנפקת|הנפקה\s+של|גיוס|הרחבת)\s+(סדר(ה|ת)\s+)?(אג["״]?ח|אגרות\s+(ה)?חוב|נע["״]?מ|ניירות\s+ערך\s+מסחריים|כתבי\s+התחייבות)'
      - 'מכרז\s+(ל)?מוסדיים'
      - '\b(issuance|offering|placement|expansion)\s+of\s+(a\s+)?(new\s+)?(series\s+of\s+)?(bonds?|debentures?|commercial\s+paper)\b'
      - '\b(bonds?|debentures?|commercial\s+paper)\s+(issuance|offering|series\s+expansion)\b'

  conference_presentation:
    base: 18
    label: Conference / webcast
    patterns:
      - "\\b(to present at|will present at|to participate in|investor (day|conference)|webcast|fireside chat)\\b"
      - "\\b(poster presentation|abstract accepted)\\b"

  patent_grant:
    base: 22
    label: Patent granted
    patterns:
      - "\\b(receives?|granted|issued) .{0,20}\\b(patent|patents)\\b"
      - "\\bnotice of allowance\\b"

  award_recognition:
    base: 10
    label: Award / recognition / ESG
    patterns:
      - "\\b(named a leader|recognized (as|by)|wins? .{0,20}award|Gartner Magic Quadrant|best places to work)\\b"
      - "\\b(sustainability report|ESG report|corporate responsibility)\\b"

# ---------------------------------------------------------------------------
# Noise suppression. Matching items are hard-capped at `cap` regardless of any
# other signal. This is what keeps the feed usable for a day trader.
# ---------------------------------------------------------------------------
noise:
  hard_cap_default: 12

  form_types:
    # A scheduled-results date is calendar data, not a headline. It is collected
    # for the `calendar` table; capping it keeps it out of the ranked feed while
    # the source still shows a live item count.
    "MAYA-SCHEDULE": 6
    # Same for the Bank of Israel's next decision date (collect/boi.py).
    "BOI-SCHEDULE": 6
    # A Form 4 whose only transaction codes are grants, option exercises, tax
    # withholding or gifts is compensation plumbing, not a trade. Left as plain
    # "4" these outranked real earnings at the top of the feed. Open-market
    # buys and sells (codes P/S) keep form_type "4" and are not capped.
    "4-ROUTINE": 12
    # Routine SEC/TASE paperwork with ~zero intraday information content
    "S-8": 8
    "424B3": 10          # resale prospectus - already-issued shares
    "424B2": 10
    "144": 6             # notice of proposed sale
    # A 13G is a PASSIVE crossing of 5% - an index fund rebalancing, usually.
    # It is not an insider and usually not even a new decision. EDGAR labels
    # these "SCHEDULE 13G", not "SC 13G", so the cap below never fired and
    # fourteen of them scored 40 as "insider activity". Both spellings now.
    # 13D is deliberately absent: an activist stake IS material.
    "SC 13G": 14
    "SC 13G/A": 12
    "SCHEDULE 13G": 14
    "SCHEDULE 13G/A": 12
    "SC 13F-HR": 6
    # An FDA supplement (label/site/packaging change) classifies as
    # regulatory_decision_primary at base 92 like any other approval, and
    # 61 of 70 approvals in a fortnight were supplements - mostly rival
    # generics houses. Capped so the nine ORIG approvals, which are the
    # actual competitive events, are not buried under them.
    "FDA-SUPPL": 22
    # An analyst "maintains" that moves no price target is the desk
    # restating a position nobody asked about. Kept for corroboration -
    # three maintains after a print is itself a signal to the agent - but
    # held out of the ranked feed, exactly as routine Form 4s are.
    # Upgrades, downgrades, initiations and any target change are tagged
    # RATING-ACTION instead and are not capped.
    "RATING-ROUTINE": 20
    # A limit-up-limit-down pause says the stock moved fast, which the tape
    # already said. Kept - the agent can use "halted twice in an hour" -
    # but never allowed to outrank a news-pending halt.
    "HALT-VOLATILITY": 24
    "ARS": 5
    "DEF 14A": 15
    "DEFA14A": 12
    "PRE 14A": 12
    "CERT": 5
    "8-A12B": 8
    "EFFECT": 5
    "FWP": 12
    "NT 10-Q": 55        # exception: late filing IS material - not noise
    "3": 6
    "5": 5
    "SD": 5              # conflict minerals
    "ARS/A": 5
    "6-K/A": 25

  # --- Post-move commentary ---------------------------------------------- #
  # Articles generated BECAUSE the stock already moved. They quote the move back
  # at you and then guess at reasons, so they read as confirmation of a cause
  # when they are an effect of it. Offering one as the driver of the move it
  # describes is circular reasoning with a hyperlink.
  #
  # These carry a cap like any other noise pattern, AND `whats_moving` keeps
  # them out of `drivers` and labels them "written after the move". One list,
  # both uses, so the scoring and the label can never disagree.
  reactive_patterns:
    - pattern: "\\b(shares?|stock) (gap(s|ped)? (up|down)|trading (up|down)|moves? (higher|lower))\\b"
      cap: 14
    - pattern: "\\b(gap(s|ped)? (up|down) .{0,20}what'?s next|what'?s next for)\\b"
      cap: 14
    - pattern: "\\b(shares?|stock) (up|down|rises?|falls?|jumps?|sinks?|gains?|drops?) [0-9.]+ ?%"
      cap: 14
    - pattern: "\\b(price ?tracker|stock price (up|down)|trading (up|down) [0-9.]+ ?%)\\b"
      cap: 14
    - pattern: "\\b(gains?|rises?|falls?|slides?|climbs?) as investors (weigh|digest|assess|eye)\\b"
      cap: 16
    - pattern: "\\b(why (is|are) .{0,25} (stock|shares) (up|down|moving|rising|falling))\\b"
      cap: 14
    - pattern: "\\b(stocks? that are moving|movers?:|biggest movers)\\b"
      cap: 12
    # Hebrew market wraps do exactly the same job: "בורסת ת"א מתחזקת אחרי
    # ההצהרה של טראמפ; טאואר עולה ב-3.5%" is the move being reported back, with
    # the cause attributed to a macro headline - it was ranked as the driver of
    # Tower's 6.2% day. The percentage-move form is the giveaway.
    - pattern: '(בורסת|הבורסה) ת"א'
      cap: 14
    - pattern: '(עולה|עולות|יורדת|יורדות|מזנקת|צונחת|מטפסת|נופלת|מאבדת|מוסיפה|נסגרה|ננעלה)\s+ב[-־]?\s*[0-9]+([.,][0-9]+)?%'
      cap: 14
    - pattern: '(נעילה|מסחר) (חיובי|שלילי|מעורב)'
      cap: 14
    # "<Company> Is Up 14.1% After ..." - the same recap without the word
    # "shares", which is how OPKO's got through.
    - pattern: "\\b(is|are|was|were) (up|down) [0-9.]+ ?%"
      cap: 14
    - pattern: "\\b(soars?|plunges?|tumbles?|surges?|spikes?|slumps?) [0-9.]+ ?%"
      cap: 14

  title_patterns:
    # --- Automated stock-analysis content ---------------------------------- #
    # Generated per ticker, on a schedule, from the price series alone:
    # "Technical Analysis: Support, Resistance, Indicators", "Risk Assessment:
    # Volatility", "Price Prediction", "Is Further Upside Left?". They contain
    # nothing that did not come from the chart - and one of them, on base 28
    # with no event and a tape-confirmation bonus, outranked a Teva guidance
    # raise carrying base 86.
    - pattern: "\\b(technical analysis|risk assessment|valuation analysis|price prediction|stock forecast|price forecast|chart analysis)\\b"
      cap: 10
    - pattern: "\\b(support,? resistance|moving averages?|RSI|MACD|fibonacci)\\b.{0,40}\\b(indicator|level|signal)"
      cap: 10
    - pattern: "\\b(is (further )?upside left|should you (buy|sell|own)|is it a (buy|sell)|worth (buying|watching)|hidden gem)\\b"
      cap: 12

    - pattern: "\\b(annual general meeting|extraordinary general meeting|AGM|EGM|proxy statement|notice of meeting)\\b"
      cap: 15
    - pattern: "\\b(to (present|participate)|will (present|host|participate)|investor conference|webcast (of|will))\\b"
      cap: 18
    - pattern: "\\b(appoints? .{0,30}(director|board member)|board of directors appoint)\\b"
      cap: 22
    - pattern: "\\b(publishes|releases) .{0,20}(sustainability|ESG|corporate responsibility|diversity) report\\b"
      cap: 8
    - pattern: "\\b(celebrates|congratulates|sponsors|donates|charitable|partnership with .{0,20}(university|school))\\b"
      cap: 8
    - pattern: "\\b(webinar|white ?paper|blog post|case study|customer story)\\b"
      cap: 8
    - pattern: "\\b(participation in|attends) .{0,25}(exhibition|trade show|expo)\\b"
      cap: 10
    - pattern: "\\b(monthly|weekly) (shareholding|share capital) (update|notification)\\b"
      cap: 6
    - pattern: "\\b(total voting rights|holdings? in company|transaction in own shares)\\b"
      cap: 10
    - pattern: "דוח מיידי על שינוי בהחזקות בעל עניין|הודעה על אסיפה|תשקיף מדף"
      cap: 12
    # MAYA's routine report types, as the new Maya site titles them. They had
    # no event and sat on the default base, so the share register, officer
    # rosters and dormant-share counts of 26 TA-35 names competed with news.
    - pattern: 'מרשם\s+בעלי\s+(ה)?מניות|מצבת\s+(ה)?הון|מצבת\s+נושאי\s+משרה|הנהלה\s+ונושאי\s+משרה|מניות\s+רדומות|\bdormant\s+shares\b|\bregister\s+of\s+(securities\s+)?holders\b'
      cap: 8
    - pattern: '(שינוי|שינויים)\s+(ב)?החזקות\s+(ב["״]ע|בעל(י)?\s+(ה)?עני(י)?ן)|החזקות\s+בעלי\s+עני(י)?ן|\bholdings?\s+of\s+interested\s+parties\b'
      cap: 10
    # A holder crossing 5% either way. Worth seeing, not ranking.
    - pattern: 'חדל(ה)?\s+להיות\s+בעל(ת)?\s+עני(י)?ן|(הפך|הפכה)\s+לבעל(ת)?\s+עני(י)?ן|\bceased\s+to\s+be\s+an?\s+interested\s+party\b|\bbecame\s+an?\s+interested\s+party\b'
      cap: 20
    # Bond service - coupons and redemptions on the issuer's debt series.
    - pattern: '(פדיון|פירעון)\s+(מוקדם|חלקי|סופי|מנדטורי)|תשלום\s+(ריבית|קרן)|\b(partial|early|final)\s+redemption\b|\binterest\s+payment\b'
      cap: 10
    - pattern: '(זימון|כינוס|תוצאות|דוח\s+(מיידי\s+)?על)\s+(ה)?אסיפה|אסיפה\s+(כללית|שנתית|מיוחדת)|אסיפת\s+(בעלי|מחזיקי)'
      cap: 14
    # A rating ASSIGNED to a new bond or affirmed unchanged. Up- and downgrades
    # do not match this and are scored as rating actions.
    - pattern: '(קובעת|נותנת|מאשררת|מותירה|הותירה|אישררה|מאשרת)\s+(את\s+)?(ה)?דירוג|דירוג\s+.{0,40}ל(הנפקת|גיוס)'
      cap: 14
    # Class-action procedure. Banks and insurers get a filing, a withdrawal or
    # a discovery motion most weeks; a settlement with an amount on it is not
    # caught here and scores as litigation_outcome.
    - pattern: 'הסתלקות|בקשה\s+לאישור\s+(ה)?תובענה\s+(כ)?ייצוגית|בקשה\s+לגילוי\s+(ו)?עיון|מחיקת\s+(ה)?(ערעור|ערעורים|תביעה|בקשה)|לייצוגית\s+בק["״]ע'
      cap: 20
    # Shares or options issued to directors and staff - pay, not a raise.
    - pattern: '(הנפקה|הקצאה)\s+פרטית.{0,80}(דירקטור|עובד|נושא(י)?\s+משרה|מנכ["״]ל|יו["״]ר)|(הקצאת|הענקת)\s+(אופציות|מניות|יחידות)\s+(חסומות\s+)?ל(עובדים|דירקטורים|נושאי\s+משרה|מנכ)|תגמול\s+(הוני|נושאי\s+משרה)'
      cap: 12
    - pattern: 'FORM\s*144|הודעה\s+על\s+כוונה\s+למכור'
      cap: 6
    - pattern: "\\b(price target)\\b.{0,20}\\b(maintained|reiterat)"
      cap: 20
    # 13F holdings filler. Automated "Fund X Buys N Shares of Y" pieces are
    # generated in bulk from quarterly filings that are up to 45 days stale, and
    # they were ranking third in the feed - above Teva's own earnings release.
    # An institution rebalancing tells a day trader nothing.
    - pattern: "\\b(buys?|sold|sells?|acquires?|purchases?)\\s+[\\d,\\.]+\\s+shares\\b"
      cap: 10
    - pattern: "\\b(raises|lowers|boosts|trims|reduces|increases|decreases|cuts)\\s+(its\\s+)?(stock\\s+)?(position|stake|holdings?)\\b"
      cap: 10
    - pattern: "\\bhas\\s+\\$[\\d,\\.]+\\s+(million|billion)\\s+(stock\\s+)?(position|holdings?|stake)\\b"
      cap: 10
    - pattern: "\\b(takes|acquires|makes)\\s+(a\\s+)?(new\\s+)?(position|stake)\\s+in\\b"
      cap: 10
    # The four above all require the verb and the noun to be adjacent, so
    # "E20 Capital Ltd Purchases New Holdings in Tower Semiconductor" and
    # "Migdal Insurance Boosts Ormat Technologies Stock Position" both slipped
    # through - and the first was then offered as the driver of a 6.2% move.
    # Anchored on an INSTITUTIONAL subject so that a company taking a stake in
    # something (real M&A) is not caught by the same net.
    - pattern: "\\b(capital|advisors?|advisers?|asset management|investment management|wealth|financial group|fund|partners|trust|insurance|bancorp|holdings? (llc|inc|ltd))\\b.{0,60}?\\b(buys?|purchases?|acquires?|takes|boosts?|raises?|lifts?|grows?|adds? to|sells?|sold|lowers?|trims?|reduces?|cuts?|decreases?)\\b.{0,45}?\\b(new\\s+)?(stock\\s+)?(position|stake|holdings?|shares)\\b"
      cap: 10
    - pattern: "\\b(13F|institutional (investors?|holdings?|ownership))\\b"
      cap: 12
    # SEC rule-filing housekeeping by an exchange. Reaches us because the
    # Federal Register is a sector regulator channel, but a Nasdaq listing-rule
    # amendment is not a pharma or semiconductor event.
    - pattern: "\\bSelf-Regulatory Organizations\\b"
      cap: 10

  # Aggregator-only, low-trust items never reach ALERT without corroboration
  require_corroboration_below_trust: 0.7
  corroboration_cap: 60

# ---------------------------------------------------------------------------
# Relation multipliers - how much an item about something *else* matters to us
# ---------------------------------------------------------------------------
relations:
  DIRECT:        1.00     # our issuer / our CIK / our IR feed
  SUBSIDIARY:    0.95     # OPC Energy -> KEN, Elbit America -> ESLT
  PRODUCT_RIVAL: 0.85     # same molecule / same mechanism / same socket
  PEER:          0.65     # named competitor's own news
  CUSTOMER:      0.70     # a customer's capex/order (TSMC -> CAMT)
  SUPPLIER:      0.55
  SECTOR_REG:    0.60     # regulator action on the sector
  SECTOR_THEME:  0.45     # thematic story touching the sector
  MACRO:         0.35

# float_class -> sensitivity. A $50m float microcap moves 20% on news that a
# $20bn large cap shrugs off.
float_sensitivity:
  micro: 1.25
  small: 1.12
  mid: 1.00
  large: 0.90
  unknown: 1.00

# ---------------------------------------------------------------------------
# Recency: intraday traders decay fast. Half-life in hours.
# ---------------------------------------------------------------------------
recency:
  half_life_hours: 8
  floor: 0.25              # never decay below this (so the archive stays searchable)
  # Items published while the US market is closed but before the open are the
  # most tradeable of all - they create the gap.
  premarket_boost: 6       # +6 raw points, 04:00-09:30 ET
  intraday_boost: 4        # +4 raw points, 09:30-16:00 ET

# ---------------------------------------------------------------------------
# Price-action confirmation. If the tape is already moving, the news is real.
# ---------------------------------------------------------------------------
price_confirmation:
  enabled: true
  abs_move_pct_threshold: 3.0
  volume_multiple_threshold: 2.0
  boost_move: 8
  boost_volume: 6
  # An unexplained move with NO news is itself an alert ("what do they know?")
  unexplained_move_pct: 5.0
  unexplained_alert_score: 70

# ---------------------------------------------------------------------------
# Per-ticker overrides
# ---------------------------------------------------------------------------
overrides:
  CGEN:
    # TIGIT-class read-across is effectively direct news for Compugen
    relation_overrides:
      PRODUCT_RIVAL: 0.95
  KEN:
    # Kenon is a HOLDING company. NRG, Vistra and Talen are peers of OPC Energy
    # and CPV - the assets - not of the listed entity, whose price also carries
    # holding-company discount, currency and disposal news. The read-across is
    # real but one step removed, so it is discounted rather than dropped.
    relation_overrides:
      PEER: 0.45
  PERI:
    # Bing/Google terms-of-trade changes have historically caused >30% gaps
    keyword_boosts:
      - pattern: "\\b(Microsoft|Bing)\\b.{0,60}\\b(search|advertis|revenue share|agreement)\\b"
        boost: 25
      - pattern: "\\bGoogle\\b.{0,50}\\b(antitrust remedy|ad tech divestiture|policy change)\\b"
        boost: 15
  AUDC:
    keyword_boosts:
      - pattern: "\\bMicrosoft\\b.{0,60}\\b(Teams|Operator Connect|Direct Routing|certif)"
        boost: 20
  ICL:
    keyword_boosts:
      - pattern: "\\b(China|India)\\b.{0,40}\\bpotash\\b.{0,25}\\bcontract\\b"
        boost: 20
      - pattern: "\\bDead Sea\\b.{0,40}\\b(concession|royalt|franchise)\\b"
        boost: 22
  ESLT:
    keyword_boosts:
      - pattern: "\\b(arms embargo|export licen[cs]e (suspend|revok|denied))\\b.{0,40}\\bIsrael\\b"
        boost: 25
      - pattern: "\\b(Germany|Netherlands|UK|Denmark|Spain)\\b.{0,50}\\b(halts?|suspends?)\\b.{0,30}\\barms\\b"
        boost: 20
  TEVA:
    keyword_boosts:
      - pattern: "\\bfirst (generic|to file)\\b"
        boost: 12
      - pattern: "\\bAUSTEDO\\b|\\bAJOVY\\b|\\bUZEDY\\b"
        boost: 10
  ORMP:
    keyword_boosts:
      - pattern: "\\b(reverse (stock )?split|Nasdaq (minimum bid|compliance))\\b"
        boost: 15
  PANW:
    # The metrics the print actually reacts to are NGS ARR and RPO, not revenue.
    keyword_boosts:
      - pattern: "\\b(NGS ARR|next-generation security ARR|remaining performance obligation|RPO)\\b"
        boost: 14
      - pattern: "\\bplatformization\\b"
        boost: 10
      - pattern: "\\bMicrosoft\\b.{0,60}\\b(bundl|includ|E5|G5|Defender)\\b"
        boost: 18
  # --- TA-35 additions ------------------------------------------------------ #
  # The one storyline each of these trades on between results.
  NWMD:
    keyword_boosts:
      - pattern: '(לוויתן|לויתן|Leviathan).{0,60}(ייצוא|יצוא|מצרים|הרחבת|export|Egypt|expansion|FID)'
        boost: 12
  DLEKG:
    # Delek Group's value is NewMed's Leviathan stake and Ithaca's North Sea
    # barrels, so the same storyline reaches it one step removed.
    keyword_boosts:
      - pattern: '(לוויתן|לויתן|Leviathan|Ithaca|איתקה)'
        boost: 6
  NVPT:
    keyword_boosts:
      - pattern: '(Shenandoah|שננדואה|Sea\s+Lion|סי\s+ליון)'
        boost: 12
  BEZQ:
    keyword_boosts:
      - pattern: '(משרד\s+התקשורת|Ministry\s+of\s+Communications).{0,60}(סיטונאי|wholesale|תעריפ|tariff|פיקוח)'
        boost: 12
  POLI:
    keyword_boosts:
      - pattern: '(היטל|מס\s+רווחי\s+יתר|bank\s+levy|windfall\s+tax)'
        boost: 15
  LUMI:
    keyword_boosts:
      - pattern: '(היטל|מס\s+רווחי\s+יתר|bank\s+levy|windfall\s+tax)'
        boost: 15
  DSCT:
    keyword_boosts:
      - pattern: '(היטל|מס\s+רווחי\s+יתר|bank\s+levy|windfall\s+tax)'
        boost: 15
  MZTF:
    keyword_boosts:
      - pattern: '(היטל|מס\s+רווחי\s+יתר|bank\s+levy|windfall\s+tax)'
        boost: 15
  FIBI:
    keyword_boosts:
      - pattern: '(היטל|מס\s+רווחי\s+יתר|bank\s+levy|windfall\s+tax)'
        boost: 15
