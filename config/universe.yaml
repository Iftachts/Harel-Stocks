# =============================================================================
# Harel Terminal - Stock universe
# =============================================================================
# Every entry drives collection AND entity-linking. Fields:
#
#   name          Legal/common name (used for headline matching)
#   aliases       Other strings that mean "this company" in a headline
#   cik           SEC CIK (leave null -> resolved at runtime from SEC ticker map)
#   tase_id       TASE security id for MAYA (null -> not dual listed / unknown)
#   sector        Key into config/sectors.yaml
#   float_class   micro | small | mid | large  -> news sensitivity multiplier
#   ir_feeds      Company-controlled press release feeds (highest trust).
#                 NOTE: these URLs follow each company's usual site convention
#                 but have NOT been verified against the live sites. Run
#                 `harel verify-feeds` on first deployment and fix the dead
#                 ones. A wrong URL degrades that name to Google News (trust
#                 0.6) rather than losing it entirely.
#   peers         Tickers/companies whose news reads across to this name
#   themes        Free-text terms that make a sector story relevant to this name
#   products      Product-level watch terms (drug names, platforms, programs)
#   catalysts     Recurring scheduled events to track in the calendar
# =============================================================================

